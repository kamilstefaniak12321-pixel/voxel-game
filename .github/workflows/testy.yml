name: Testy gry

# npm test (wszystkie testy) i prawdziwa gra w Chrome (WebGL2): świat
# w trybie programisty ze sceną "Światło i materiały" (src/dev/scenes.js,
# tools/sprawdz_swiatlo_webgl.mjs). Do 0.54.0 - "Laboratorium światła".

# Pull request - tylko z etykietą "kompilacja" (jak próbne kompilacje
# w aplikacja.yml): etykietę dodaje się, gdy PR jest gotowy, wtedy
# każdy push sprawdza od nowa (starsze sprawdzenie jest przerywane).
# Bez etykiety przebieg jest pomijany i nie zużywa minut Actions.
# Ręcznie: Actions -> Testy gry -> Run workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/testy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'kompilacja')
        && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja')
        && format('testy-pr-{0}', github.event.pull_request.number)
    || format('testy-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  testy:
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'kompilacja')
          && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - name: Motywy GUI i ekwipunek w Chrome
        timeout-minutes: 2
        run: node tools/sprawdz_motyw_gui_webgl.mjs
        env:
          UI_SCREENSHOTS_IN_LOG: '1'
      - name: Gra i shadery w WebGL2
        run: node tools/sprawdz_swiatlo_webgl.mjs
      - name: Animowane pochodnie i barwniki w WebGL2
        timeout-minutes: 2
        run: node tools/sprawdz_pochodnie_webgl.mjs
        env:
          UI_SCREENSHOTS_IN_LOG: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: testy-gry
          path: |
            test-results/sceny/
            test-results/grey-wood/
            test-results/torches/
          retention-days: 7
