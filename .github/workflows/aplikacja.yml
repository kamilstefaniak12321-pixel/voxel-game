# ------------------------------------------------------------
# APLIKACJE - instalator dla Windowsa i aplikacja na Androida (.apk)
#
# - Pull request zmieniający aplikację (desktop/, android/,
#   package.json...) z etykietą "kompilacja" - tylko próbne zbudowanie
#   (instalator i .apk do pobrania przez 2 dni w zakładce Actions -> ten
#   przebieg -> Artifacts), bez wydania. Etykietę dodaje się, gdy PR jest
#   gotowy; potem każdy push buduje od nowa (starsza próba jest
#   przerywana). PR bez etykiety nie zużywa minut Actions.
# - Wypchnięcie na main: jeśli w repozytorium z wydaniami
#   (package.json -> build.publish) nie ma jeszcze KOMPLETNEGO wydania
#   tej wersji - instalatora .exe, pliku .blockmap i latest.yml (z niego
#   zainstalowana gra wie, że jest aktualizacja) - instalator jest
#   budowany i publikowany. Wydanie, któremu brakuje plików (np. po
#   przerwanym wysyłaniu), jest uzupełniane. Kompletne wydanie tej samej
#   wersji = nic się nie dzieje, więc nowe wydanie = podniesienie
#   "version" w package.json.
# - Actions -> "Aplikacje (komputer i telefon)" -> Run workflow - to samo
#   ręcznie.
#
# Android (job "android", po Windowsie): aplikacja z folderu android/
# (Capacitor), pliki gry kopiowane przed budowaniem (npm run
# android:sync). Z sekretami ANDROID_KEYSTORE i ANDROID_KEYSTORE_PASSWORD
# powstaje wydanie podpisane kluczem gry - do wydania obok instalatora
# trafiają: Voxel-Game-<wersja>-android.apk, paczka z plikami gry
# Voxel-Game-<wersja>-android-www.zip i android-latest.json (z niego
# zainstalowana aplikacja wie, że jest aktualizacja - jak latest.yml na
# komputerze), a także szablon paczki tekstur Voxel-Game-paczka-tekstur.zip
# (folder paczka-tekstur-szablon/, docs/paczki-tekstur.md); wydanie bez
# któregoś z nich jest uzupełniane. Bez
# sekretów - tylko wersja testowa "Voxel Game (test)" w Artifacts.
# Opis: docs/telefon.md.
#
# Instalator buduje electron-builder (bez wysyłania), a do wydania
# wysyła go GitHub CLI (gh). Gdy coś się nie uda, ostatnie linie
# błędu są widoczne od razu na stronie przebiegu (adnotacje), a lista
# plików wydania - w adnotacji "Wydanie".
#
# Wymaga sekretu WYDANIA_TOKEN (token z prawem zapisu do repozytorium
# z wydaniami). Bez niego instalator jest tylko budowany. Opis:
# docs/aplikacja.md.
# ------------------------------------------------------------

name: Aplikacje (komputer i telefon)

on:
  push:
    branches: [main]
  pull_request:
    # labeled - dodanie etykiety "kompilacja" (niżej) uruchamia próbę.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'tools/android-www.mjs'
      - 'paczka-tekstur-szablon/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/aplikacja.yml'
  workflow_dispatch:

permissions:
  contents: read

# Jeden przebieg naraz:
# - w PR z etykietą "kompilacja" nowszy push przerywa starszą próbę
#   (liczy się tylko ostatni stan PR-a),
# - na main wydania czekają w kolejce (nie są przerywane); gdy czeka
#   kilka, zostaje najnowszy - jego wydanie zawiera też wcześniejsze
#   zmiany,
# - przebiegi pominięte (PR bez etykiety, dodanie innej etykiety) mają
#   własną grupę, więc niczego nie przerywają.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request' && format('aplikacja-{0}', github.ref)
    || (contains(github.event.pull_request.labels.*.name, 'kompilacja')
        && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja'))
       && format('aplikacja-pr-{0}', github.event.pull_request.number)
    || format('aplikacja-pominiety-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Czy trzeba coś budować i czy publikować?
  # Pull request: tylko z etykietą "kompilacja" (próba kosztuje ok.
  # 14 minut z miesięcznego limitu Actions - Windows liczy się podwójnie).
  # Bez etykiety przebieg jest pomijany (0 minut).
  wersja:
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'kompilacja')
          && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      repo: ${{ steps.check.outputs.repo }}
      exe: ${{ steps.check.outputs.exe }}
      apk: ${{ steps.check.outputs.apk }}
      www: ${{ steps.check.outputs.www }}
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
      build_android: ${{ steps.check.outputs.build_android }}
      publish_android: ${{ steps.check.outputs.publish_android }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        env:
          WYDANIA_TOKEN: ${{ secrets.WYDANIA_TOKEN }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          EVENT: ${{ github.event_name }}
        run: |
          # Wersja, repozytorium z wydaniami i nazwa instalatora - z package.json.
          VERSION=$(node -p "require('./package.json').version")
          REPO=$(node -p "const p = require('./package.json').build.publish; p.owner + '/' + p.repo")
          EXE=$(node -p 'const p = require("./package.json"); p.build.nsis.artifactName.replace("${version}", p.version).replace("${ext}", "exe")')

          APK="Voxel-Game-$VERSION-android.apk"
          WWW="Voxel-Game-$VERSION-android-www.zip"

          {
            echo "version=$VERSION"
            echo "repo=$REPO"
            echo "exe=$EXE"
            echo "apk=$APK"
            echo "www=$WWW"
          } >> "$GITHUB_OUTPUT"

          # Android: wydanie tylko z kluczem do podpisu (sekret).
          if [ -n "$ANDROID_KEYSTORE" ]; then SIGNED=true; else SIGNED=false; fi

          if [ "$EVENT" = "pull_request" ]; then
            echo "Pull request - próbne zbudowanie wersji $VERSION."
            {
              echo "build=true"
              echo "publish=false"
              echo "build_android=true"
              echo "publish_android=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$WYDANIA_TOKEN" ]; then
            echo "::warning::Brak sekretu WYDANIA_TOKEN - instalator nie zostanie opublikowany (docs/aplikacja.md)."
            if [ "$EVENT" = "workflow_dispatch" ]; then BUILD=true; else BUILD=false; fi
            {
              echo "build=$BUILD"
              echo "publish=false"
              echo "build_android=$BUILD"
              echo "publish_android=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(curl -s -o release.json -w "%{http_code}" \
            -H "Authorization: Bearer $WYDANIA_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/v$VERSION")

          if [ "$STATUS" = "401" ]; then
            echo "::error title=WYDANIA_TOKEN::Token nie działa (HTTP 401) - wygasł albo został usunięty. Zrób nowy i podmień sekret WYDANIA_TOKEN (docs/aplikacja.md)."
            exit 1
          fi

          if [ "$STATUS" = "200" ]; then

            # Wydanie jest - czy ma wszystkie pliki?
            MISSING=$(EXE="$EXE" node -e '
              const names = require("./release.json").assets.map((asset) => asset.name);
              const need = [process.env.EXE, process.env.EXE + ".blockmap", "latest.yml"];
              console.log(need.filter((name) => !names.includes(name)).join(", "));
            ')

            # Android: aplikacja, paczka plików gry i android-latest.json.
            HAS_APK=$(APK="$APK" WWW="$WWW" node -p '
              const names = require("./release.json").assets.map((asset) => asset.name);
              [process.env.APK, process.env.WWW, "android-latest.json", "Voxel-Game-paczka-tekstur.zip"].every((name) => names.includes(name))
            ')

            if [ -z "$MISSING" ]; then
              echo "Wersja $VERSION jest już wydana w $REPO (komplet plików instalatora)."
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Niepełne wydanie::Wydanie v$VERSION w $REPO nie ma plików: $MISSING - instalator zostanie zbudowany i dosłany."
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi

            if [ "$HAS_APK" = "true" ]; then
              echo "Aplikacja na Androida ($APK, $WWW, android-latest.json) też jest w wydaniu."
              echo "build_android=false" >> "$GITHUB_OUTPUT"
              echo "publish_android=false" >> "$GITHUB_OUTPUT"
            elif [ "$SIGNED" = "true" ]; then
              echo "W wydaniu brakuje plików aplikacji na Androida ($APK, $WWW, android-latest.json) - zostanie zbudowana i dosłana."
              echo "build_android=true" >> "$GITHUB_OUTPUT"
              echo "publish_android=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Android::Brak sekretu ANDROID_KEYSTORE - aplikacja na Androida nie trafi do wydania (docs/telefon.md)."
              echo "build_android=false" >> "$GITHUB_OUTPUT"
              echo "publish_android=false" >> "$GITHUB_OUTPUT"
            fi

            exit 0

          fi

          echo "Nowa wersja $VERSION - budowanie i wydanie w $REPO."

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

          if [ "$SIGNED" != "true" ]; then
            echo "::warning title=Android::Brak sekretu ANDROID_KEYSTORE - w wydaniu będzie tylko instalator dla Windowsa, aplikacja na Androida tylko w wersji testowej w Artifacts (docs/telefon.md)."
          fi

          echo "build_android=true" >> "$GITHUB_OUTPUT"
          echo "publish_android=$SIGNED" >> "$GITHUB_OUTPUT"

  windows:
    needs: wersja
    if: needs.wersja.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.wersja.outputs.version }}
      REPO: ${{ needs.wersja.outputs.repo }}
      EXE: ${{ needs.wersja.outputs.exe }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Samo budowanie (bez wysyłania). Przy błędzie ostatnie linie
      # wyniku trafiają do adnotacji.
      - name: Zbuduj instalator
        run: |
          set -o pipefail
          if ! npx electron-builder --win --x64 --publish never 2>&1 | tee build.log; then
            TEXT=$(tail -n 30 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=Budowanie instalatora::$TEXT"
            exit 1
          fi

      # Czy są wszystkie pliki wydania i czy latest.yml wskazuje na ten instalator.
      - name: Sprawdź pliki
        run: |
          for FILE in "dist/$EXE" "dist/$EXE.blockmap" "dist/latest.yml"; do
            if [ ! -f "$FILE" ]; then
              echo "::error title=Brak pliku::Nie powstał $FILE. W dist/ jest: $(ls dist | tr '\n' ' ')"
              exit 1
            fi
          done

          if ! grep -q "url: $EXE" dist/latest.yml; then
            echo "::error title=latest.yml::latest.yml nie wskazuje na $EXE:%0A$(sed 's/%/%25/g' dist/latest.yml | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi

          SIZE=$(( $(stat -c %s "dist/$EXE") / 1024 / 1024 ))
          echo "::notice title=Instalator::$EXE ($SIZE MB), $EXE.blockmap, latest.yml"

      # Instalator do pobrania z przebiegu (Artifacts) - tylko na 2 dni:
      # repozytorium jest prywatne, a darmowy plan ma 0,5 GB miejsca na
      # takie pliki na miesiąc (liczone za każdą godzinę leżenia).
      # Brak miejsca nie zatrzymuje wydania (continue-on-error).
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: Voxel-Game-${{ needs.wersja.outputs.version }}-instalator
          path: dist/*.exe
          retention-days: 2

      # Wysłanie do repozytorium z wydaniami: nowe wydanie albo
      # uzupełnienie istniejącego (pliki o tej samej nazwie są
      # podmieniane). Wydanie zostaje oznaczone jako najnowsze.
      - name: Opublikuj wydanie
        if: needs.wersja.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.WYDANIA_TOKEN }}
        run: |
          TAG="v$VERSION"
          FILES=("dist/$EXE" "dist/$EXE.blockmap" "dist/latest.yml")
          NOTES="Voxel Game $VERSION - Windows: pobierz $EXE i uruchom (zainstalowana gra aktualizuje się sama). Android (telefon, tablet): pobierz na telefonie Voxel-Game-$VERSION-android.apk i otwórz - nowa wersja instaluje się na starej, światy zostają; zainstalowana aplikacja (od 0.19.0) też aktualizuje się sama. Własne tekstury: Voxel-Game-paczka-tekstur.zip (szablon z oryginalnymi teksturami) - w grze Ustawienia, Tekstury."

          # Uruchamia komendę; przy błędzie pokazuje jej wynik w adnotacji.
          run() {
            if ! "$@" > out.log 2>&1; then
              cat out.log
              echo "::error title=Wydanie::$* %0A$(sed -e 's/%/%25/g' -e 's/\r//g' out.log | awk 'BEGIN { ORS = "%0A" } { print }')"
              exit 1
            fi
            cat out.log
          }

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Wydanie $TAG jest - dosyłam pliki."
            run gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber
            run gh release edit "$TAG" --repo "$REPO" --title "$TAG" --notes "$NOTES" --draft=false --prerelease=false --latest
          else
            echo "Nowe wydanie $TAG."
            run gh release create "$TAG" "${FILES[@]}" --repo "$REPO" --title "$TAG" --notes "$NOTES" --latest
          fi

      # Sprawdzenie z zewnątrz: pliki wydania i czy instalator da się
      # pobrać bez logowania (tak, jak pobiera go gracz i aktualizator).
      - name: Sprawdź wydanie
        if: needs.wersja.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.WYDANIA_TOKEN }}
        run: |
          TAG="v$VERSION"
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name) (\(.size / 1048576 | floor) MB)"' | tr '\n' ',' | sed 's/,$//; s/,/, /g')

          URL="https://github.com/$REPO/releases/download/$TAG/$EXE"
          CODE=$(curl -s -L -o /dev/null -r 0-1023 -w "%{http_code}" "$URL")
          LATEST=$(curl -s -L "https://github.com/$REPO/releases/latest/download/latest.yml" | grep -m1 '^version:' || true)

          echo "::notice title=Wydanie::$TAG: $ASSETS%0APobieranie $EXE bez logowania: HTTP $CODE%0Areleases/latest/download/latest.yml: $LATEST"

          if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
            echo "::error title=Pobieranie::Instalatora nie da się pobrać: $URL (HTTP $CODE)"
            exit 1
          fi


  # ----------------------------------------------------------
  # Android: aplikacja .apk (po Windowsie - żeby nie tworzyć tego
  # samego wydania naraz). Opis: docs/telefon.md.
  # ----------------------------------------------------------

  android:
    needs: [wersja, windows]
    if: always() && needs.wersja.outputs.build_android == 'true'
    # Konkretna wersja systemu (z gotowym Android SDK) - "latest" zmienia
    # się sam i mógłby nagle zepsuć budowanie.
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.wersja.outputs.version }}
      REPO: ${{ needs.wersja.outputs.repo }}
      APK: ${{ needs.wersja.outputs.apk }}
      WWW: ${{ needs.wersja.outputs.www }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # cache: gradle - Gradle i biblioteki Androida z poprzedniego
      # przebiegu (bez pobierania wszystkiego od nowa).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Pliki gry (index.html, src/, assets/, lib/) do aplikacji.
      - name: Pliki gry do aplikacji
        run: npm run android:sync

      # Klucz do podpisu z sekretów: jest - wydanie (release), nie ma -
      # wersja testowa "Voxel Game (test)" (debug, osobna aplikacja).
      - name: Klucz do podpisu
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/voxelgame.p12"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/voxelgame.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "KIND=release"
              echo "OUT=$APK"
            } >> "$GITHUB_ENV"
            echo "Wydanie podpisane kluczem gry."
          else
            {
              echo "KIND=debug"
              echo "OUT=Voxel-Game-$VERSION-android-TEST.apk"
            } >> "$GITHUB_ENV"
            echo "::warning title=Android::Brak sekretów ANDROID_KEYSTORE / ANDROID_KEYSTORE_PASSWORD - powstanie tylko wersja testowa \"Voxel Game (test)\" (osobna aplikacja, nie trafia do wydań). Jak dodać klucz: docs/telefon.md."
          fi

      - name: Zbuduj aplikację
        working-directory: android
        run: |
          set -o pipefail
          if [ "$KIND" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          chmod +x gradlew
          if ! ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee ../build.log; then
            TEXT=$(grep -E "error|FAILED|What went wrong|Exception" -A 3 ../build.log | head -n 40 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=Budowanie aplikacji::$TEXT"
            exit 1
          fi

      # Czy plik powstał, co jest w środku (nazwa, wersja, podpis).
      - name: Sprawdź aplikację
        run: |
          FILE=$(ls android/app/build/outputs/apk/$KIND/*.apk | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error title=Brak pliku::Nie powstał plik .apk ($KIND)."
            exit 1
          fi

          mkdir -p dist
          cp "$FILE" "dist/$OUT"

          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          BADGING=$("$TOOLS/aapt2" dump badging "dist/$OUT" | grep -E "^package:|^application-label:|^(min)?[sS]dkVersion|^targetSdkVersion" | tr '\n' ' ')
          CERT=$("$TOOLS/apksigner" verify --print-certs "dist/$OUT" | grep -m1 "SHA-256" || true)
          SIZE=$(( $(stat -c %s "dist/$OUT") / 1024 / 1024 ))

          echo "::notice title=Aplikacja ($KIND)::$OUT ($SIZE MB)%0A$BADGING%0A$CERT"

      # Aktualizacja dla zainstalowanej aplikacji (src/app/AndroidUpdates.js,
      # AktualizacjePlugin.java): paczka z plikami gry dokładnie takimi,
      # jak w aplikacji (assets/public, z wersja.json - wersja i odcisk
      # części na telefon) i android-latest.json - co jest w wydaniu
      # (nazwy, rozmiary, SHA-256).
      - name: Paczka aktualizacji
        env:
          PUBLIC: android/app/src/main/assets/public
        run: |
          if [ ! -f "$PUBLIC/wersja.json" ]; then
            echo "::error title=Paczka aktualizacji::Brak $PUBLIC/wersja.json (tools/android-www.mjs)."
            exit 1
          fi

          rm -f "dist/$WWW"
          (cd "$PUBLIC" && zip -q -r -X "$GITHUB_WORKSPACE/dist/$WWW" .)

          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const env = process.env;
            const file = (name) => {
              const data = fs.readFileSync("dist/" + name);
              return { file: name, size: data.length, sha256: crypto.createHash("sha256").update(data).digest("hex") };
            };
            const info = JSON.parse(fs.readFileSync(env.PUBLIC + "/wersja.json", "utf8"));
            if (info.version !== env.VERSION) {
              throw new Error("wersja.json: " + info.version + " zamiast " + env.VERSION);
            }
            const latest = { version: env.VERSION, native: info.native, www: file(env.WWW), apk: file(env.OUT) };
            fs.writeFileSync("dist/android-latest.json", JSON.stringify(latest, null, 2) + "\n");
          '

          SIZE=$(( $(stat -c %s "dist/$WWW") / 1024 ))
          echo "::notice title=Paczka aktualizacji::$WWW ($SIZE kB)%0A$(sed -e 's/%/%25/g' dist/android-latest.json | awk 'BEGIN { ORS = "%0A" } { print }')"

      # Szablon paczki tekstur (oryginalne tekstury - tools/paczka_tekstur.py)
      # - gra otwiera go z najnowszego wydania (Ustawienia -> Tekstury).
      - name: Szablon paczki tekstur
        run: |
          rm -f dist/Voxel-Game-paczka-tekstur.zip
          (cd paczka-tekstur-szablon && zip -q -r -X "$GITHUB_WORKSPACE/dist/Voxel-Game-paczka-tekstur.zip" .)
          echo "::notice title=Szablon paczki tekstur::Voxel-Game-paczka-tekstur.zip ($(( $(stat -c %s dist/Voxel-Game-paczka-tekstur.zip) / 1024 )) kB, $(find paczka-tekstur-szablon -name '*.png' | wc -l) obrazków)"

      # Jak instalator wyżej: 2 dni, brak miejsca nie zatrzymuje wydania.
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: ${{ env.OUT }}
          path: dist/*.apk
          retention-days: 2

      # Do wydania - tylko podpisana kluczem gry i tylko gdy Windows się
      # udał albo nie był potrzebny (wydanie z instalatorem już jest).
      - name: Opublikuj w wydaniu
        if: needs.wersja.outputs.publish_android == 'true' && env.KIND == 'release' && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
        env:
          GH_TOKEN: ${{ secrets.WYDANIA_TOKEN }}
        run: |
          TAG="v$VERSION"
          EXE=$(node -p 'const p = require("./package.json"); p.build.nsis.artifactName.replace("${version}", p.version).replace("${ext}", "exe")')
          NOTES="Voxel Game $VERSION - Windows: pobierz $EXE i uruchom (zainstalowana gra aktualizuje się sama). Android (telefon, tablet): pobierz na telefonie $APK i otwórz - nowa wersja instaluje się na starej, światy zostają; zainstalowana aplikacja (od 0.19.0) też aktualizuje się sama. Własne tekstury: Voxel-Game-paczka-tekstur.zip (szablon z oryginalnymi teksturami) - w grze Ustawienia, Tekstury."

          run() {
            if ! "$@" > out.log 2>&1; then
              cat out.log
              echo "::error title=Wydanie::$* %0A$(sed -e 's/%/%25/g' -e 's/\r//g' out.log | awk 'BEGIN { ORS = "%0A" } { print }')"
              exit 1
            fi
            cat out.log
          }

          # Najpierw aplikacja i paczka, na końcu android-latest.json - gdy
          # zainstalowana gra go zobaczy, pliki już są.

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Wydanie $TAG jest - dosyłam $APK, $WWW i szablon paczki tekstur."
            run gh release upload "$TAG" "dist/$APK" "dist/$WWW" dist/Voxel-Game-paczka-tekstur.zip --repo "$REPO" --clobber
            run gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
          else
            echo "Nowe wydanie $TAG (bez instalatora dla Windowsa)."
            run gh release create "$TAG" "dist/$APK" "dist/$WWW" dist/Voxel-Game-paczka-tekstur.zip --repo "$REPO" --title "$TAG" --notes "$NOTES"
          fi

          run gh release upload "$TAG" dist/android-latest.json --repo "$REPO" --clobber

          URL="https://github.com/$REPO/releases/download/$TAG/$APK"
          CODE=$(curl -s -L -o /dev/null -r 0-1023 -w "%{http_code}" "$URL")
          LATEST=$(curl -s -L "https://github.com/$REPO/releases/latest/download/android-latest.json" | node -e 'let t = ""; process.stdin.on("data", (d) => t += d).on("end", () => { try { console.log(JSON.parse(t).version); } catch { console.log("brak"); } })')
          echo "::notice title=Wydanie (Android)::$TAG: $APK, $WWW, android-latest.json%0APobieranie bez logowania: HTTP $CODE%0Areleases/latest/download/android-latest.json: wersja $LATEST"

          if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
            echo "::error title=Pobieranie::Aplikacji nie da się pobrać: $URL (HTTP $CODE)"
            exit 1
          fi
