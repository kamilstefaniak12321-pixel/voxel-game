<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Voxel Starter</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 0 0 3px black;
            user-select: none;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            font-size: 13px;
            text-shadow: 0 0 2px black;
            pointer-events: none;
            line-height: 1.4;
        }
    </style>

    <!-- Układ menu (src/ui/menu.css), HUD w grze (src/ui/hud.css)
         i motyw (wybierany w ustawieniach) -->
    <link rel="stylesheet" href="./src/ui/menu.css">
    <link rel="stylesheet" href="./src/ui/hud.css">
    <link rel="stylesheet" id="theme-css">
</head>

<body data-screen="menu">

<div id="crosshair">+</div>
<div id="info"></div>

<!-- Pasek bloków (tworzony w src/ui/Hotbar.js) -->
<div id="hotbar"></div>

<!-- Ekrany menu (tworzone w src/ui/Menu.js) -->
<div id="menu"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module" src="./src/main.js"></script>

</body>
</html>
