<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <!-- Telefon: strona na cały ekran, bez powiększania palcami; przy
         otwartej klawiaturze strona się zmniejsza (czat zostaje widoczny) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Voxel Starter</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 0 0 3px black;
            user-select: none;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            font-size: 13px;
            text-shadow: 0 0 2px black;
            pointer-events: none;
            line-height: 1.4;
        }
    </style>

    <!-- Układ menu (src/ui/menu.css), HUD w grze (src/ui/hud.css),
         osiągnięcia (src/ui/achievements.css), sterowanie dotykowe
         (src/ui/touch.css) i motyw (wybierany w ustawieniach) -->
    <link rel="stylesheet" href="./src/ui/menu.css">
    <link rel="stylesheet" href="./src/ui/hud.css">
    <link rel="stylesheet" href="./src/ui/inventory-theme.css">
    <link rel="stylesheet" href="./src/ui/inventory.css">
    <link rel="stylesheet" href="./src/ui/inventory-wood.css">
    <link rel="stylesheet" href="./src/ui/achievements.css">
    <link rel="stylesheet" href="./src/ui/touch.css">
    <link rel="stylesheet" href="./src/ui/menu-scene.css">
    <!-- Motyw jest ostatni, żeby obejmował też kolory sceny menu. -->
    <link rel="stylesheet" id="theme-css">
</head>

<body data-screen="menu">

<!-- Pod wodą: niebieska poświata (src/game/WaterEffects.js) -->
<div id="underwater"></div>

<!-- Powiadomienia o zdobytych osiągnięciach (src/achievements/) -->
<div id="achievements"></div>

<!-- Samopoczucie: przyciemnienie u wyczerpanego, etykieta stanu i okno
     statusu (src/ui/StatusPanel.js) -->
<div id="weary"></div>
<div id="wellbeing" hidden></div>
<div id="status" hidden></div>

<div id="crosshair">+</div>
<div id="info"></div>

<!-- Licznik klatek (ustawienie "Licznik FPS") -->
<div id="fps" hidden></div>

<!-- Pasek bloków (tworzony w src/ui/Hotbar.js) -->
<div id="hotbar"></div>

<!-- Czat i komendy (src/ui/Chat.js) -->
<div id="chat">
    <div class="chat-log"></div>
    <input class="chat-input" type="text" maxlength="256"
           autocomplete="off" spellcheck="false" aria-label="Czat">
</div>

<!-- Ekrany menu (tworzone w src/ui/Menu.js) -->
<div id="menu"></div>

<!-- three.js 0.160.0 jest w lib/three (gra działa bez internetu,
     także jako aplikacja na komputer - desktop/) -->

<script type="importmap">
{
    "imports": {
        "three": "./lib/three/three.module.js"
    }
}
</script>

<script type="module" src="./src/bootstrap.js"></script>

</body>
</html>
