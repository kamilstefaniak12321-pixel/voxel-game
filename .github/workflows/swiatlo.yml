name: Laboratorium światła

# Pull request - tylko z etykietą "kompilacja" (jak próbne kompilacje
# w aplikacja.yml): etykietę dodaje się, gdy PR jest gotowy, wtedy
# każdy push sprawdza od nowa (starsze sprawdzenie jest przerywane).
# Bez etykiety przebieg jest pomijany i nie zużywa minut Actions.
# Ręcznie: Actions -> Laboratorium światła -> Run workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'tools/sprawdz_swiatlo*.mjs'
      - 'tools/sprawdz_tarcze.mjs'
      - 'tools/sprawdz_ciemnosc.mjs'
      - 'tools/sprawdz_cienie.mjs'
      - 'tools/sprawdz_materialy*.mjs'
      - 'tools/sprawdz_odlamki.mjs'
      - 'tools/sprawdz_warmup_wody.mjs'
      - 'tools/surface_render_checks.js'
      - 'tools/shadow_render_checks.js'
      - 'tools/light_room_checks.js'
      - 'package.json'
      - '.github/workflows/swiatlo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'kompilacja')
        && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja')
        && format('swiatlo-pr-{0}', github.event.pull_request.number)
    || format('swiatlo-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  swiatlo:
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'kompilacja')
          && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - name: Gra i shadery w WebGL2
        run: node tools/sprawdz_swiatlo_webgl.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: laboratorium-swiatla
          path: test-results/light-lab/
          retention-days: 7
