name: Laboratorium światła

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/sprawdz_swiatlo*.mjs'
      - 'tools/sprawdz_tarcze.mjs'
      - 'tools/sprawdz_ciemnosc.mjs'
      - 'tools/light_room_checks.js'
      - 'package.json'
      - '.github/workflows/swiatlo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiatlo:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - name: Gra i shadery w WebGL2
        run: node tools/sprawdz_swiatlo_webgl.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: laboratorium-swiatla
          path: test-results/light-lab/
          retention-days: 7
