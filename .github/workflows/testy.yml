name: Testy gry

# npm test (wszystkie testy) i prawdziwa gra w Chrome (WebGL2): świat
# w trybie programisty ze sceną "Światło i materiały" (src/dev/scenes.js,
# tools/sprawdz_swiatlo_webgl.mjs). Do 0.54.0 - "Laboratorium światła".

# Pull request - tylko z etykietą "kompilacja" (jak próbne kompilacje
# w aplikacja.yml): etykietę dodaje się, gdy PR jest gotowy, wtedy
# każdy push sprawdza od nowa (starsze sprawdzenie jest przerywane).
# Bez etykiety przebieg jest pomijany i nie zużywa minut Actions.
# Ręcznie: Actions -> Testy gry -> Run workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/testy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'kompilacja')
        && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja')
        && format('testy-pr-{0}', github.event.pull_request.number)
    || format('testy-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  testy:
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'kompilacja')
          && (github.event.action != 'labeled' || github.event.label.name == 'kompilacja'))
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - name: Atlasy tekstur — zgodność pikseli, modeli i ikon w grze
        timeout-minutes: 3
        run: node tools/sprawdz_atlasy_webgl.mjs
      - name: Akacja, cypryśnik i wiśnia w skali gracza
        timeout-minutes: 3
        run: node tools/sprawdz_nowe_drzewa_webgl.mjs
      - name: Miłorząb, jakaranda oraz regresje skrzyni i pochodni
        timeout-minutes: 3
        run: node tools/sprawdz_drzewa_085_webgl.mjs
      - name: Losowe lasy, warianty i porównanie drzew w grze
        timeout-minutes: 3
        run: node tools/sprawdz_pokaz_drzew_webgl.mjs
      - name: Klon, kosodrzewina, oliwka, eukaliptus i sekwoja oraz ich biomy
        timeout-minutes: 8
        run: node tools/sprawdz_drzewa_083_webgl.mjs
      - name: Tratwa, sterowanie i spływ wodospadem w prawdziwej grze
        timeout-minutes: 3
        run: node tools/sprawdz_tratwe_webgl.mjs
      - name: Wyporność i ciągły spływ rzeką w prawdziwej grze
        timeout-minutes: 3
        run: node tools/sprawdz_plywanie_webgl.mjs
      - name: Wodospady, zapętlone kręgi i koszt efektów w WebGL2
        timeout-minutes: 3
        run: node tools/sprawdz_fale_wodospadow_webgl.mjs
      - name: Pikselowe wodospady i piana na tafli w WebGL2
        timeout-minutes: 3
        run: node tools/sprawdz_wodospady_pikselowe_webgl.mjs
      - name: Rozlewanie wody, zapis i koszt zalewania w WebGL2
        timeout-minutes: 3
        run: node tools/sprawdz_wode_webgl.mjs
      - name: Podzielone siatki terenu i roślin w WebGL2
        timeout-minutes: 2
        run: node tools/sprawdz_streaming_webgl.mjs
      - name: Głębia obrazu i przejścia szczegółowości w WebGL2
        timeout-minutes: 2
        run: node tools/sprawdz_glebie_webgl.mjs
      - name: Tekstury drewna, mech i narzędzia w grze
        timeout-minutes: 2
        run: node tools/sprawdz_tekstury_drewna_webgl.mjs
      - name: Logi, raport i obsługa błędów w prawdziwej grze
        timeout-minutes: 2
        run: node tools/sprawdz_logi_webgl.mjs
      - name: Motywy GUI i ekwipunek w Chrome
        timeout-minutes: 2
        run: node tools/sprawdz_motyw_gui_webgl.mjs
        env:
          UI_SCREENSHOTS_IN_LOG: '1'
      - name: Gra i shadery w WebGL2
        run: node tools/sprawdz_swiatlo_webgl.mjs
      - name: Animowane pochodnie i barwniki w WebGL2
        timeout-minutes: 2
        run: node tools/sprawdz_pochodnie_webgl.mjs
        env:
          UI_SCREENSHOTS_IN_LOG: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: testy-gry
          path: |
            test-results/texture-atlases/
            test-results/trees-085/
            test-results/new-trees/
            test-results/trees-083/
            test-results/waterfall-pixels/
            test-results/tree-showcase/
            test-results/rafts/
            test-results/river-swimming/
            test-results/waterfall-ripples/
            test-results/water-flow/
            test-results/streaming/
            test-results/depth-reuse/
            test-results/wood-textures/
            test-results/diagnostics/
            test-results/sceny/
            test-results/grey-wood/
            test-results/torches/
          retention-days: 7
